    --success-dark: #145038;
    --success-bg: #E4F5EC;

    flex-direction: column;

  .tile .tile-label { font-weight: 700; font-size: 16px; font-family: "Prompt", sans-serif; }
  .tile .tile-desc { font-size: 13px; opacity: 0.85; line-height: 1.4; }
  .tile.tile-green { background: #FCE4ED; color: #8F1345; }
  .tile.tile-blue { background: #FFF3D6; color: #8F6100; }

  /* ---- โครงสร้าง Sidebar (responsive: จอกว้าง=แถบข้าง, จอแคบ=เมนูเลื่อน) ---- */
