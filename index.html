<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

// ---- แก้ 2 ค่านี้ให้ตรงกับโปรเจกต์ Supabase ของคุณ ----
const SUPABASE_URL = "https://wpaghjsgvjueqfjaxkyw.supabase.co";
const SUPABASE_KEY = "sb_publishable_Iyv8GG8ufYUdwG8U8BF5tg_tu8qJuw_";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: false },
});

const MONTH_NAMES = ["", "ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.",
  "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];

// ---- สำหรับปุ่ม Export/Backup (Admin) - เชื่อมกับ Apps Script Web App ----
const BACKUP_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxv56G8CcFNV_nQyO6toXCgV_s1wW2oDRZChNtvkeud0hbFdz15q8A_YqIxm2mfNj5X/exec";
const BACKUP_SECRET = "5508ede4b28fb4f69e54cebf2bf52135c1c1dc88f8a35eeb";

// ---- เมนู "⋯" แบบ dropdown ใช้แทนแถวปุ่มที่ล้นจอ ----
function ActionMenu({ items }) {
  const [open, setOpen] = useState(false);
  const ref = React.useRef(null);

  useEffect(() => {
    if (!open) return;
    const handleClickOutside = (e) => {
      if (ref.current && !ref.current.contains(e.target)) setOpen(false);
    };
    document.addEventListener("mousedown", handleClickOutside);
    return () => document.removeEventListener("mousedown", handleClickOutside);
  }, [open]);

  return (
    <div className="menu-wrap" ref={ref}>
      <div className="menu-btn" onClick={() => setOpen(!open)}>
        <i className="ti ti-dots-vertical" aria-hidden="true"></i>
      </div>
      {open && (
        <div className="menu-dropdown">
          {items.map((item, i) => (
            <button
              key={i}
              className={item.danger ? "danger-item" : ""}
              onClick={() => {
                setOpen(false);
                item.onClick();
              }}
            >
              {item.icon && <i className={"ti " + item.icon} aria-hidden="true"></i>}
              {item.label}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

// ---- หน้า Login ----
function LoginPage({ onLogin }) {
  const [code, setCode] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  const handleLogin = async () => {
    setError("");
    if (!code.trim()) return;
    setLoading(true);
    const email = code.trim() + "@qpt.internal";
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: code.trim(),
    });
    setLoading(false);
    if (error) {
      setError("รหัสพนักงานไม่ถูกต้อง หรือยังไม่มีในระบบ");
      return;
    }
    onLogin(data.session);
  };

  return (
    <div className="container">
      <div style={{ textAlign: "center", marginBottom: 24 }}>
        <div
          className="icon-circle ok"
          style={{ width: 56, height: 56, fontSize: 28, margin: "0 auto 14px" }}
        >
          <i className="ti ti-clipboard-check" aria-hidden="true"></i>
        </div>
        <h2 style={{ margin: 0 }}>ระบบข้อสอบ QPT</h2>
        <p style={{ color: "var(--ink-soft)", fontSize: 14, marginTop: 6 }}>
          กรอกรหัสพนักงานเพื่อเข้าสู่ระบบ
        </p>
      </div>
      <input
        type="text"
        inputMode="numeric"
        placeholder="กรอกรหัสพนักงาน"
        value={code}
        onChange={(e) => setCode(e.target.value)}
        onKeyDown={(e) => e.key === "Enter" && handleLogin()}
        autoFocus
        style={{ textAlign: "center", fontSize: 18, letterSpacing: 1 }}
      />
      <button style={{ width: "100%", marginTop: 8 }} onClick={handleLogin} disabled={loading}>
        {loading ? "กำลังเข้าสู่ระบบ..." : "เข้าสู่ระบบ"}
      </button>
      {error && (
        <div className="error" style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <i className="ti ti-alert-circle" aria-hidden="true"></i>
          {error}
        </div>
      )}
    </div>
  );
}

// ---- หน้าปฏิทินอบรม (แอดมิน) ----
function AdminCalendarPage() {
  const [year] = useState(2026);
  const [calendarRows, setCalendarRows] = useState([]);
  const [materialsByCourse, setMaterialsByCourse] = useState({});
  const [examsByCourse, setExamsByCourse] = useState({});
  const [selectedMonth, setSelectedMonth] = useState(null);
  const [selectedEntry, setSelectedEntry] = useState(null);
  const [completionRows, setCompletionRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const [backupStatus, setBackupStatus] = useState(""); // "", "loading", "success", "error"
  const [backupMessage, setBackupMessage] = useState("");
  const [backupUrl, setBackupUrl] = useState("");
  const [lastBackupRunAt, setLastBackupRunAt] = useState(null); // Date | null

  useEffect(() => {
    loadAll();
    loadLastBackupStatus();
  }, []);

  const loadLastBackupStatus = async () => {
    const { data } = await supabaseClient
      .from("backup_runs")
      .select("run_at")
      .order("run_at", { ascending: false })
      .limit(1)
      .maybeSingle();
    setLastBackupRunAt(data ? new Date(data.run_at) : null);
  };

  const handleBackup = async () => {
    setBackupStatus("loading");
    setBackupMessage("กำลัง backup... (อาจใช้เวลา 5-10 วินาที)");
    setBackupUrl("");
    try {
      const res = await fetch(BACKUP_WEB_APP_URL + "?secret=" + encodeURIComponent(BACKUP_SECRET));
      const data = await res.json();
      if (data.success) {
        setBackupStatus("success");
        const counts = Object.entries(data.rowsAdded || {})
          .map(([table, count]) => table + ": " + count)
          .join(", ");
        setBackupMessage("บันทึกสำเร็จ (" + counts + ")");
        setBackupUrl(data.spreadsheetUrl || "");
        setLastBackupRunAt(new Date()); // อัปเดตสถานะทันที ไม่ต้องรอ fetch ใหม่
      } else {
        setBackupStatus("error");
        setBackupMessage("บันทึกไม่สำเร็จ: " + (data.error || "ไม่ทราบสาเหตุ"));
      }
    } catch (err) {
      setBackupStatus("error");
      setBackupMessage("เชื่อมต่อไม่สำเร็จ: " + err.message);
    }
  };

  const loadAll = async () => {
    setLoading(true);
    const [calRes, matRes, examRes] = await Promise.all([
      supabaseClient
        .from("training_calendar")
        .select("id, year, month, course_id, courses(name)")
        .eq("year", year)
        .order("month"),
      supabaseClient.from("course_materials").select("course_id"),
      supabaseClient.from("exams").select("id, course_id"),
    ]);

    setCalendarRows(calRes.data || []);

    const matCount = {};
    (matRes.data || []).forEach((r) => {
      matCount[r.course_id] = (matCount[r.course_id] || 0) + 1;
    });
    setMaterialsByCourse(matCount);

    const examCount = {};
    (examRes.data || []).forEach((r) => {
      examCount[r.course_id] = (examCount[r.course_id] || 0) + 1;
    });
    setExamsByCourse(examCount);

    if (calRes.data && calRes.data.length > 0 && selectedMonth === null) {
      setSelectedMonth(calRes.data[0].month);
    }
    setLoading(false);
  };

  const openEntry = async (entry) => {
    setSelectedEntry(entry);
    const { data } = await supabaseClient
      .from("v_course_completion")
      .select("employee_name, employee_code, total_exams, passed_exams, completed")
      .eq("calendar_id", entry.id)
      .order("employee_name");
    setCompletionRows(data || []);
  };

  if (loading) return <div className="page">กำลังโหลดปฏิทิน...</div>;

  const months = [...new Set(calendarRows.map((r) => r.month))].sort((a, b) => a - b);
  const rowsThisMonth = calendarRows.filter((r) => r.month === selectedMonth);

  if (selectedEntry) {
    const matCount = materialsByCourse[selectedEntry.course_id] || 0;
    const examCount = examsByCourse[selectedEntry.course_id] || 0;
    return (
      <div className="page">
        <div className="header-row">
          <button className="secondary" onClick={() => setSelectedEntry(null)}>
            ← กลับไปปฏิทิน
          </button>
          <button className="refresh-btn" onClick={() => openEntry(selectedEntry)}>
            🔄 รีเฟรช
          </button>
        </div>
        <h2 style={{ marginTop: 16 }}>
          {selectedEntry.courses ? selectedEntry.courses.name : "หลักสูตร"}
        </h2>
        <p>
          {MONTH_NAMES[selectedEntry.month]} {selectedEntry.year}
        </p>
        <span className={"badge " + (matCount > 0 ? "ok" : "warn")}>
          เอกสาร {matCount} ไฟล์
        </span>
        <span className={"badge " + (examCount > 0 ? "ok" : "warn")}>
          ข้อสอบ {examCount} ชุด
        </span>

        <h3 style={{ marginTop: 24 }}>คะแนนพนักงาน</h3>
        {completionRows.length === 0 ? (
          <p style={{ color: "#667085" }}>ยังไม่มีใครทำข้อสอบในรอบนี้</p>
        ) : (
          <table>
            <thead>
              <tr>
                <th>รหัส</th>
                <th>ชื่อ</th>
                <th>ผ่าน/ทั้งหมด</th>
                <th>สถานะ</th>
              </tr>
            </thead>
            <tbody>
              {completionRows.map((r, i) => (
                <tr key={i}>
                  <td>{r.employee_code}</td>
                  <td>{r.employee_name}</td>
                  <td>{r.passed_exams} / {r.total_exams}</td>
                  <td className={r.completed ? "pass" : "fail"}>
                    {r.completed ? "ผ่านครบ" : "ยังไม่ผ่าน"}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
    );
  }

  const now = new Date();
  const backedUpThisMonth = lastBackupRunAt
    && lastBackupRunAt.getFullYear() === now.getFullYear()
    && lastBackupRunAt.getMonth() === now.getMonth();

  return (
    <div className="page">
      <div className="header-row">
        <h2>ปฏิทินอบรม ปี {year}</h2>
        <div style={{ display: "flex", gap: 8 }}>
          <button
            className="refresh-btn"
            onClick={handleBackup}
            disabled={backupStatus === "loading"}
          >
            {backupStatus === "loading" ? "⏳ กำลัง Backup..." : "📦 Export/Backup"}
          </button>
          <button className="refresh-btn" onClick={loadAll}>🔄 รีเฟรช</button>
        </div>
      </div>

      <div style={{ marginBottom: 12 }}>
        {backedUpThisMonth ? (
          <span className="badge ok">
            ✅ backup ข้อมูลเดือน {MONTH_NAMES[now.getMonth() + 1]} {now.getFullYear()} แล้ว
            {" "}(ล่าสุด {lastBackupRunAt.toLocaleDateString("th-TH")})
          </span>
        ) : (
          <span className="badge warn">
            ⚠️ ยังไม่ได้ backup ข้อมูลเดือน {MONTH_NAMES[now.getMonth() + 1]} {now.getFullYear()}
            {lastBackupRunAt ? " (ล่าสุด " + lastBackupRunAt.toLocaleDateString("th-TH") + ")" : " (ยังไม่เคย backup เลย)"}
          </span>
        )}
      </div>

      {backupMessage && (
        <p style={{
          color: backupStatus === "error" ? "#b42318" : "#067647",
          fontSize: 14,
          marginTop: -8,
        }}>
          {backupMessage}
          {backupUrl && (
            <>
              {" "}
              <a href={backupUrl} target="_blank" rel="noopener noreferrer">
                เปิดไฟล์ Backup
              </a>
            </>
          )}
        </p>
      )}

      <div className="month-tabs">
        {months.map((m) => (
          <div
            key={m}
            className={"month-tab" + (m === selectedMonth ? " active" : "")}
            onClick={() => setSelectedMonth(m)}
          >
            {MONTH_NAMES[m]}
          </div>
        ))}
      </div>

      {rowsThisMonth.length === 0 ? (
        <p style={{ color: "#667085" }}>ไม่มีหลักสูตรจัดสอนเดือนนี้</p>
      ) : (
        rowsThisMonth.map((entry) => {
          const matCount = materialsByCourse[entry.course_id] || 0;
          const examCount = examsByCourse[entry.course_id] || 0;
          return (
            <div className="course-card" key={entry.id} onClick={() => openEntry(entry)}>
              <div className="icon-circle ok">
                <i className="ti ti-book-2" aria-hidden="true"></i>
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontWeight: 600, marginBottom: 6 }}>
                  {entry.courses ? entry.courses.name : "(ไม่พบชื่อหลักสูตร)"}
                </div>
                <span className={"badge " + (matCount > 0 ? "ok" : "warn")}>
                  เอกสาร {matCount}
                </span>
                <span className={"badge " + (examCount > 0 ? "ok" : "warn")}>
                  ข้อสอบ {examCount}
                </span>
              </div>
              <i className="ti ti-chevron-right" style={{ color: "var(--ink-soft)", fontSize: 18, flexShrink: 0 }} aria-hidden="true"></i>
            </div>
          );
        })
      )}
    </div>
  );
}

// ---- หน้าวางแผนอบรมรายปี (แอดมิน) ----
function AnnualPlannerPage() {
  const [year, setYear] = useState(2026);
  const [courses, setCourses] = useState([]);
  const [calendarRows, setCalendarRows] = useState([]);
  const [materialsByCourse, setMaterialsByCourse] = useState({});
  const [examsByCourse, setExamsByCourse] = useState({});
  const [loading, setLoading] = useState(true);
  const [searchQuery, setSearchQuery] = useState("");
  const [filterMode, setFilterMode] = useState("all"); // all | unplanned | no_materials | no_exam
  const [showAddForm, setShowAddForm] = useState(false);
  const [newCourseId, setNewCourseId] = useState("");
  const [isNewCourse, setIsNewCourse] = useState(false);
  const [newCourseName, setNewCourseName] = useState("");
  const [newMonth, setNewMonth] = useState(1);
  const [editingId, setEditingId] = useState(null);
  const [editingMonth, setEditingMonth] = useState(1);
  const [saveError, setSaveError] = useState("");

  // ---- รายละเอียดแผน: จัดการเอกสาร + ข้อสอบของหลักสูตรนั้น ----
  const [selectedPlanEntry, setSelectedPlanEntry] = useState(null);
  const [planMaterials, setPlanMaterials] = useState([]);
  const [planExams, setPlanExams] = useState([]);
  const [loadingDetail, setLoadingDetail] = useState(false);
  const [detailError, setDetailError] = useState("");
  const [newMaterialTitle, setNewMaterialTitle] = useState("");
  const [newMaterialUrl, setNewMaterialUrl] = useState("");
  const [uploadingFile, setUploadingFile] = useState(false);
  const [uploadError, setUploadError] = useState("");
  const [editingMaterialId, setEditingMaterialId] = useState(null);
  const [editingMaterialTitle, setEditingMaterialTitle] = useState("");
  const [editingMaterialUrl, setEditingMaterialUrl] = useState("");
  const [editingExamId, setEditingExamId] = useState(null);
  const [editingExamUrl, setEditingExamUrl] = useState("");

  useEffect(() => {
    loadAll();
  }, [year]);

  const loadAll = async () => {
    setLoading(true);
    setSaveError("");
    const [courseRes, calRes, matRes, examRes] = await Promise.all([
      supabaseClient.from("courses").select("id, name").order("name"),
      supabaseClient
        .from("training_calendar")
        .select("id, year, month, course_id, courses(name)")
        .eq("year", year)
        .order("month"),
      supabaseClient.from("course_materials").select("course_id"),
      supabaseClient.from("exams").select("id, course_id"),
    ]);

    setCourses(courseRes.data || []);
    setCalendarRows(calRes.data || []);

    const matCount = {};
    (matRes.data || []).forEach((r) => {
      matCount[r.course_id] = (matCount[r.course_id] || 0) + 1;
    });
    setMaterialsByCourse(matCount);

    const examCount = {};
    (examRes.data || []).forEach((r) => {
      examCount[r.course_id] = (examCount[r.course_id] || 0) + 1;
    });
    setExamsByCourse(examCount);

    setLoading(false);
  };

  const plannedCourseIds = new Set(calendarRows.map((r) => r.course_id));
  const unplannedCourses = courses.filter((c) => !plannedCourseIds.has(c.id));

  const totalCourses = courses.length;
  const plannedCount = plannedCourseIds.size;
  const unplannedCount = unplannedCourses.length;
  const examNotReadyCount = [...plannedCourseIds].filter(
    (cid) => (examsByCourse[cid] || 0) === 0
  ).length;

  const matchesSearch = (name) =>
    !searchQuery.trim() || (name || "").toLowerCase().includes(searchQuery.trim().toLowerCase());

  const handleAddPlan = async () => {
    if (!newMonth) {
      setSaveError("กรุณาเลือกเดือน");
      return;
    }
    setSaveError("");

    let courseIdToUse = newCourseId;

    if (isNewCourse) {
      if (!newCourseName.trim()) {
        setSaveError("กรุณากรอกชื่อหลักสูตรใหม่");
        return;
      }
      const { data: newCourse, error: courseError } = await supabaseClient
        .from("courses")
        .insert({ name: newCourseName.trim() })
        .select()
        .single();
      if (courseError) {
        setSaveError("สร้างหลักสูตรใหม่ไม่สำเร็จ: " + courseError.message);
        return;
      }
      courseIdToUse = newCourse.id;
    } else if (!newCourseId) {
      setSaveError("กรุณาเลือกหลักสูตร");
      return;
    }

    const { error } = await supabaseClient
      .from("training_calendar")
      .insert({ course_id: courseIdToUse, year, month: newMonth });
    if (error) {
      setSaveError("เพิ่มแผนไม่สำเร็จ: " + error.message);
      return;
    }
    setShowAddForm(false);
    setNewCourseId("");
    setIsNewCourse(false);
    setNewCourseName("");
    setNewMonth(1);
    loadAll();
  };

  const startEdit = (entry) => {
    setEditingId(entry.id);
    setEditingMonth(entry.month);
    setSaveError("");
  };

  const saveEdit = async (entry) => {
    const { error } = await supabaseClient
      .from("training_calendar")
      .update({ month: editingMonth })
      .eq("id", entry.id);
    if (error) {
      setSaveError("แก้ไขไม่สำเร็จ: " + error.message);
      return;
    }
    setEditingId(null);
    loadAll();
  };

  const handleDelete = async (entry) => {
    if (!window.confirm("ลบแผนอบรม \"" + (entry.courses ? entry.courses.name : "") + "\" เดือน " + MONTH_NAMES[entry.month] + " ออกจากปฏิทินหรือไม่?")) {
      return;
    }
    const { error } = await supabaseClient.from("training_calendar").delete().eq("id", entry.id);
    if (error) {
      setSaveError("ลบไม่สำเร็จ: " + error.message + " (อาจมีข้อมูล session/ผลสอบผูกอยู่กับแผนนี้แล้ว)");
      return;
    }
    loadAll();
  };

  // ---- เปิดหน้ารายละเอียด: โหลดเอกสาร + ข้อสอบของหลักสูตรนี้ ----
  const openPlanDetail = async (entry) => {
    setSelectedPlanEntry(entry);
    setDetailError("");
    setLoadingDetail(true);
    const [matRes, examRes] = await Promise.all([
      supabaseClient
        .from("course_materials")
        .select("id, title, drive_url")
        .eq("course_id", entry.course_id),
      supabaseClient
        .from("exams")
        .select("id, exam_name, exam_form_url")
        .eq("course_id", entry.course_id)
        .order("exam_name"),
    ]);
    setPlanMaterials(matRes.data || []);
    setPlanExams(examRes.data || []);
    setLoadingDetail(false);
  };

  const refreshPlanDetail = () => {
    if (selectedPlanEntry) openPlanDetail(selectedPlanEntry);
  };

  const addMaterial = async () => {
    if (!newMaterialTitle.trim() || !newMaterialUrl.trim()) {
      setDetailError("กรุณากรอกชื่อเอกสารและลิงก์ให้ครบ");
      return;
    }
    setDetailError("");
    const { error } = await supabaseClient.from("course_materials").insert({
      course_id: selectedPlanEntry.course_id,
      title: newMaterialTitle.trim(),
      drive_url: newMaterialUrl.trim(),
    });
    if (error) {
      setDetailError("เพิ่มเอกสารไม่สำเร็จ: " + error.message);
      return;
    }
    setNewMaterialTitle("");
    setNewMaterialUrl("");
    refreshPlanDetail();
    loadAll();
  };

  const handleFileUpload = (e) => {
    const file = e.target.files[0];
    e.target.value = ""; // เผื่อเลือกไฟล์เดิมซ้ำอีกครั้งในอนาคต ให้ onChange ทำงานอีกได้
    if (!file) return;

    if (file.type !== "application/pdf") {
      setUploadError("รองรับเฉพาะไฟล์ PDF เท่านั้น");
      return;
    }
    if (file.size > 15 * 1024 * 1024) {
      setUploadError("ไฟล์ใหญ่เกินไป (จำกัด 15 MB)");
      return;
    }

    setUploadError("");
    setUploadingFile(true);

    const reader = new FileReader();
    reader.onload = async () => {
      try {
        // reader.result เป็น "data:application/pdf;base64,xxxxx" ตัดเอาแค่ส่วน base64 จริง
        const base64Data = reader.result.split(",")[1];
        const res = await fetch(BACKUP_WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify({
            secret: BACKUP_SECRET,
            filename: file.name,
            mimeType: file.type,
            base64Data: base64Data,
          }),
        });
        const data = await res.json();
        if (data.success) {
          setNewMaterialUrl(data.url);
          if (!newMaterialTitle.trim()) {
            setNewMaterialTitle(file.name.replace(/\.pdf$/i, ""));
          }
        } else {
          setUploadError("อัปโหลดไม่สำเร็จ: " + (data.error || "ไม่ทราบสาเหตุ"));
        }
      } catch (err) {
        setUploadError("อัปโหลดไม่สำเร็จ: " + err.message);
      } finally {
        setUploadingFile(false);
      }
    };
    reader.onerror = () => {
      setUploadError("อ่านไฟล์ไม่สำเร็จ");
      setUploadingFile(false);
    };
    reader.readAsDataURL(file);
  };

  const startEditMaterial = (m) => {
    setEditingMaterialId(m.id);
    setEditingMaterialTitle(m.title || "");
    setEditingMaterialUrl(m.drive_url || "");
  };

  const saveEditMaterial = async (m) => {
    if (!editingMaterialUrl.trim()) {
      setDetailError("ลิงก์เอกสารห้ามว่าง");
      return;
    }
    const { error } = await supabaseClient
      .from("course_materials")
      .update({ title: editingMaterialTitle.trim(), drive_url: editingMaterialUrl.trim() })
      .eq("id", m.id);
    if (error) {
      setDetailError("แก้ไขเอกสารไม่สำเร็จ: " + error.message);
      return;
    }
    setEditingMaterialId(null);
    refreshPlanDetail();
  };

  const deleteMaterial = async (m) => {
    if (!window.confirm("ลบเอกสาร \"" + (m.title || m.drive_url) + "\" หรือไม่?")) return;
    const { error } = await supabaseClient.from("course_materials").delete().eq("id", m.id);
    if (error) {
      setDetailError("ลบเอกสารไม่สำเร็จ: " + error.message);
      return;
    }
    refreshPlanDetail();
    loadAll();
  };

  const startEditExam = (ex) => {
    setEditingExamId(ex.id);
    setEditingExamUrl(ex.exam_form_url || "");
  };

  const saveEditExam = async (ex) => {
    if (!editingExamUrl.trim()) {
      setDetailError("ลิงก์ข้อสอบห้ามว่าง");
      return;
    }
    const confirmed = window.confirm(
      "⚠️ คำเตือนสำคัญ: การเปลี่ยนลิงก์ข้อสอบต้องตั้งค่าปลายทางคำตอบ (response destination) " +
      "ของฟอร์มใหม่ให้ไปที่ไฟล์คำตอบรวมเดิม แล้วรันฟังก์ชัน syncResponseTabNames() " +
      "ใน Apps Script ใหม่อีกครั้ง ไม่งั้นผลสอบของวิชานี้จะหยุดบันทึกเข้าระบบทันทีแบบไม่มี error เตือน\n\n" +
      "ยืนยันว่าตั้งค่าฝั่ง Google Form/Apps Script เรียบร้อยแล้ว และต้องการบันทึกลิงก์ใหม่นี้ใช่หรือไม่?"
    );
    if (!confirmed) return;

    const { error } = await supabaseClient
      .from("exams")
      .update({ exam_form_url: editingExamUrl.trim() })
      .eq("id", ex.id);
    if (error) {
      setDetailError("แก้ไขลิงก์ข้อสอบไม่สำเร็จ: " + error.message);
      return;
    }
    setEditingExamId(null);
    refreshPlanDetail();
  };

  if (loading) return <div className="page">กำลังโหลด...</div>;

  // ---- หน้ารายละเอียด: จัดการเอกสาร + ข้อสอบของหลักสูตรนี้ ----
  if (selectedPlanEntry) {
    return (
      <div className="page">
        <div className="header-row">
          <button className="secondary" onClick={() => setSelectedPlanEntry(null)}>
            ← กลับไปแผนอบรม
          </button>
          <button className="refresh-btn" onClick={refreshPlanDetail}>🔄 รีเฟรช</button>
        </div>
        <h2 style={{ marginTop: 16 }}>
          {selectedPlanEntry.courses ? selectedPlanEntry.courses.name : "หลักสูตร"}
        </h2>
        <p style={{ color: "#667085" }}>
          {MONTH_NAMES[selectedPlanEntry.month]} {selectedPlanEntry.year}
        </p>

        {detailError && <p className="error">{detailError}</p>}

        {loadingDetail ? (
          <p style={{ color: "#667085" }}>กำลังโหลด...</p>
        ) : (
          <>
            <div className="section-title" style={{ marginTop: 20 }}>
              <i className="ti ti-folder" aria-hidden="true"></i>
              เอกสารอบรม
            </div>
            {planMaterials.length === 0 && (
              <p style={{ color: "#667085" }}>ยังไม่มีเอกสาร</p>
            )}
            {planMaterials.map((m) => (
              <div className="attendance-row" key={m.id}>
                {editingMaterialId === m.id ? (
                  <div style={{ flex: 1, display: "flex", gap: 8, flexWrap: "wrap" }}>
                    <input
                      type="text"
                      placeholder="ชื่อเอกสาร"
                      value={editingMaterialTitle}
                      onChange={(e) => setEditingMaterialTitle(e.target.value)}
                      style={{ flex: 1, minWidth: 140 }}
                    />
                    <input
                      type="text"
                      placeholder="ลิงก์ Google Drive"
                      value={editingMaterialUrl}
                      onChange={(e) => setEditingMaterialUrl(e.target.value)}
                      style={{ flex: 2, minWidth: 200 }}
                    />
                    <button onClick={() => saveEditMaterial(m)}>บันทึก</button>
                    <button className="secondary" onClick={() => setEditingMaterialId(null)}>ยกเลิก</button>
                  </div>
                ) : (
                  <>
                    <div style={{ flex: 1 }}>
                      <div className="name">{m.title || "(ไม่มีชื่อ)"}</div>
                      <div className="meta">
                        <a href={m.drive_url} target="_blank" rel="noopener noreferrer">
                          เปิดเอกสาร
                        </a>
                      </div>
                    </div>
                    <button className="secondary" onClick={() => startEditMaterial(m)}>แก้ไข</button>
                    <button className="secondary" onClick={() => deleteMaterial(m)}>ลบ</button>
                  </>
                )}
              </div>
            ))}

            {uploadError && <p className="error">{uploadError}</p>}

            <div
              style={{
                marginTop: 14,
                padding: 16,
                borderRadius: 14,
                background: "var(--accent-bg)",
                border: "1px dashed var(--accent)",
              }}
            >
              <div style={{ fontWeight: 600, fontSize: 14, color: "var(--accent-dark)", marginBottom: 10 }}>
                <i className="ti ti-circle-plus" aria-hidden="true" style={{ marginRight: 6 }}></i>
                เพิ่มเอกสารใหม่
              </div>
              <label
                className="upload-btn"
                style={{
                  cursor: uploadingFile ? "default" : "pointer",
                  opacity: uploadingFile ? 0.6 : 1,
                }}
              >
                <i className={"ti " + (uploadingFile ? "ti-loader-2" : "ti-file-upload")} aria-hidden="true"></i>
                {uploadingFile ? "กำลังอัปโหลด..." : "อัปโหลดไฟล์ PDF"}
                <input
                  type="file"
                  accept="application/pdf"
                  onChange={handleFileUpload}
                  disabled={uploadingFile}
                  style={{ display: "none" }}
                />
              </label>
              <span style={{ marginLeft: 10, fontSize: 13, color: "var(--accent-dark)" }}>
                หรือวางลิงก์ Google Drive เองด้านล่าง
              </span>

              <div className="new-session-row" style={{ marginTop: 12 }}>
                <input
                  type="text"
                  placeholder="ชื่อเอกสารใหม่"
                  value={newMaterialTitle}
                  onChange={(e) => setNewMaterialTitle(e.target.value)}
                  style={{ flex: 1, minWidth: 140, margin: 0 }}
                />
                <input
                  type="text"
                  placeholder="ลิงก์ Google Drive (เติมอัตโนมัติถ้าอัปโหลดไฟล์ด้านบน)"
                  value={newMaterialUrl}
                  onChange={(e) => setNewMaterialUrl(e.target.value)}
                  style={{ flex: 2, minWidth: 200, margin: 0 }}
                />
                <button onClick={addMaterial}>+ เพิ่มเอกสาร</button>
              </div>
            </div>

            <div className="section-title" style={{ marginTop: 28 }}>
              <i className="ti ti-clipboard-list" aria-hidden="true"></i>
              ข้อสอบ
            </div>
            {planExams.length === 0 && (
              <p style={{ color: "#667085" }}>ยังไม่มีข้อสอบสำหรับหลักสูตรนี้</p>
            )}
            {planExams.map((ex) => (
              <div className="attendance-row" key={ex.id}>
                {editingExamId === ex.id ? (
                  <div style={{ flex: 1, display: "flex", gap: 8, flexWrap: "wrap" }}>
                    <input
                      type="text"
                      placeholder="ลิงก์ Google Form (URL เต็ม)"
                      value={editingExamUrl}
                      onChange={(e) => setEditingExamUrl(e.target.value)}
                      style={{ flex: 1, minWidth: 260 }}
                    />
                    <button onClick={() => saveEditExam(ex)}>บันทึก</button>
                    <button className="secondary" onClick={() => setEditingExamId(null)}>ยกเลิก</button>
                  </div>
                ) : (
                  <>
                    <div style={{ flex: 1 }}>
                      <div className="name">{ex.exam_name}</div>
                      <div className="meta">
                        <a href={ex.exam_form_url} target="_blank" rel="noopener noreferrer">
                          เปิดฟอร์มข้อสอบ
                        </a>
                      </div>
                    </div>
                    <button className="secondary" onClick={() => startEditExam(ex)}>แก้ไขลิงก์</button>
                  </>
                )}
              </div>
            ))}
          </>
        )}
      </div>
    );
  }

  // filter entries per month based on filterMode + search
  const visibleEntriesByMonth = {};
  for (let m = 1; m <= 12; m++) {
    visibleEntriesByMonth[m] = calendarRows.filter((entry) => {
      if (entry.month !== m) return false;
      const name = entry.courses ? entry.courses.name : "";
      if (!matchesSearch(name)) return false;
      if (filterMode === "no_materials") return (materialsByCourse[entry.course_id] || 0) === 0;
      if (filterMode === "no_exam") return (examsByCourse[entry.course_id] || 0) === 0;
      return true;
    });
  }

  const visibleUnplanned = unplannedCourses.filter((c) => matchesSearch(c.name));

  return (
    <div className="page">
      <div className="header-row">
        <h2>แผนอบรมประจำปี {year}</h2>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          <button className="secondary" onClick={() => setYear(year - 1)}>◀ {year - 1}</button>
          <button className="secondary" onClick={() => setYear(year + 1)}>{year + 1} ▶</button>
          <button onClick={() => setShowAddForm(!showAddForm)}>+ เพิ่มแผนอบรม</button>
        </div>
      </div>

      <div style={{ display: "flex", gap: 16, flexWrap: "wrap", margin: "12px 0", fontSize: 14, color: "#344054" }}>
        <span>หลักสูตรทั้งหมด <b>{totalCourses}</b></span>
        <span>วางแผนแล้ว <b style={{ color: "#067647" }}>{plannedCount}</b></span>
        <span>ยังไม่วางแผน <b style={{ color: "#b42318" }}>{unplannedCount}</b></span>
        <span>ข้อสอบยังไม่พร้อม <b style={{ color: "#b42318" }}>{examNotReadyCount}</b></span>
      </div>

      {showAddForm && (
        <div className="course-card" style={{ cursor: "default", display: "block" }}>
          <div style={{ display: "flex", gap: 16, marginBottom: 10 }}>
            <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 14, cursor: "pointer" }}>
              <input
                type="radio"
                checked={!isNewCourse}
                onChange={() => setIsNewCourse(false)}
                style={{ width: "auto", margin: 0 }}
              />
              เลือกหลักสูตรเดิม
            </label>
            <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 14, cursor: "pointer" }}>
              <input
                type="radio"
                checked={isNewCourse}
                onChange={() => setIsNewCourse(true)}
                style={{ width: "auto", margin: 0 }}
              />
              สร้างหลักสูตรใหม่
            </label>
          </div>
          <div className="new-session-row">
            {isNewCourse ? (
              <input
                type="text"
                placeholder="ชื่อหลักสูตรใหม่ เช่น QWS-QPT-01-025 การตรวจสอบ..."
                value={newCourseName}
                onChange={(e) => setNewCourseName(e.target.value)}
                style={{ flex: 1, minWidth: 220 }}
              />
            ) : (
              <select value={newCourseId} onChange={(e) => setNewCourseId(e.target.value)}>
                <option value="" disabled>เลือกหลักสูตร</option>
                {courses.map((c) => (
                  <option key={c.id} value={c.id}>{c.name}</option>
                ))}
              </select>
            )}
            <select value={newMonth} onChange={(e) => setNewMonth(parseInt(e.target.value, 10))}>
              {MONTH_NAMES.slice(1).map((name, i) => (
                <option key={i + 1} value={i + 1}>{name}</option>
              ))}
            </select>
            <button onClick={handleAddPlan}>บันทึก</button>
            <button
              className="secondary"
              onClick={() => {
                setShowAddForm(false);
                setIsNewCourse(false);
                setNewCourseName("");
                setNewCourseId("");
              }}
            >
              ยกเลิก
            </button>
          </div>
        </div>
      )}

      <input
        type="text"
        placeholder="ค้นหาชื่อหลักสูตร..."
        value={searchQuery}
        onChange={(e) => setSearchQuery(e.target.value)}
      />

      <div className="month-tabs">
        {[
          { key: "all", label: "ทั้งหมด" },
          { key: "unplanned", label: "ยังไม่วางแผน" },
          { key: "no_materials", label: "ขาดเอกสาร" },
          { key: "no_exam", label: "ขาดข้อสอบ" },
        ].map((f) => (
          <div
            key={f.key}
            className={"month-tab" + (filterMode === f.key ? " active" : "")}
            onClick={() => setFilterMode(f.key)}
          >
            {f.label}
          </div>
        ))}
      </div>

      {saveError && <p className="error">{saveError}</p>}

      {filterMode === "unplanned" ? (
        visibleUnplanned.length === 0 ? (
          <p style={{ color: "#667085" }}>ไม่มีหลักสูตรที่ยังไม่ได้วางแผน 🎉</p>
        ) : (
          visibleUnplanned.map((c) => (
            <div className="course-card" style={{ cursor: "default" }} key={c.id}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <span style={{ fontWeight: 600 }}>{c.name}</span>
                <button
                  className="secondary"
                  onClick={() => {
                    setNewCourseId(c.id);
                    setShowAddForm(true);
                  }}
                >
                  + วางแผน
                </button>
              </div>
            </div>
          ))
        )
      ) : (
        MONTH_NAMES.slice(1).map((monthName, idx) => {
          const m = idx + 1;
          const entries = visibleEntriesByMonth[m];
          if (filterMode !== "all" && entries.length === 0) return null;
          return (
            <div key={m} style={{ marginTop: 20 }}>
              <h3 style={{ borderBottom: "1px solid #eaecf0", paddingBottom: 6 }}>{monthName}</h3>
              {entries.length === 0 ? (
                <p style={{ color: "#667085" }}>ยังไม่มีแผนอบรม</p>
              ) : (
                entries.map((entry) => {
                  const matCount = materialsByCourse[entry.course_id] || 0;
                  const examCount = examsByCourse[entry.course_id] || 0;
                  const isEditing = editingId === entry.id;
                  return (
                    <div className="course-card" key={entry.id}>
                      <div className="icon-circle ok">
                        <i className="ti ti-book-2" aria-hidden="true"></i>
                      </div>
                      <div style={{ flex: 1, cursor: "pointer" }} onClick={() => openPlanDetail(entry)}>
                        <div style={{ fontWeight: 600 }}>
                          {entry.courses ? entry.courses.name : "(ไม่พบชื่อหลักสูตร)"}
                        </div>
                        <span className={"badge " + (matCount > 0 ? "ok" : "warn")}>เอกสาร {matCount}</span>
                        <span className={"badge " + (examCount > 0 ? "ok" : "warn")}>ข้อสอบ {examCount}</span>
                      </div>
                      {isEditing ? (
                        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                          <select value={editingMonth} onChange={(e) => setEditingMonth(parseInt(e.target.value, 10))}>
                            {MONTH_NAMES.slice(1).map((name, i) => (
                              <option key={i + 1} value={i + 1}>{name}</option>
                            ))}
                          </select>
                          <button onClick={() => saveEdit(entry)}>บันทึก</button>
                          <button className="secondary" onClick={() => setEditingId(null)}>ยกเลิก</button>
                        </div>
                      ) : (
                        <ActionMenu
                          items={[
                            { label: "จัดการเอกสาร/ข้อสอบ", icon: "ti-folder", onClick: () => openPlanDetail(entry) },
                            { label: "ย้ายเดือน", icon: "ti-calendar", onClick: () => startEdit(entry) },
                            { label: "ลบแผนนี้", icon: "ti-trash", danger: true, onClick: () => handleDelete(entry) },
                          ]}
                        />
                      )}
                    </div>
                  );
                })
              )}
            </div>
          );
        })
      )}
    </div>
  );
}

// ---- แถบกราฟแท่งเรียบง่าย (ไม่พึ่งไลบรารีภายนอก) ----
function BarRow({ label, value, maxValue, displayValue, color }) {
  const pct = maxValue > 0 ? Math.min(100, (value / maxValue) * 100) : 0;
  return (
    <div style={{ padding: "12px 4px", borderBottom: "1px solid var(--line)" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8, gap: 10 }}>
        <span style={{ color: "var(--ink)", fontSize: 14, fontWeight: 500 }}>{label}</span>
        <span
          style={{
            color: "white",
            background: color || "var(--accent)",
            fontSize: 12,
            fontWeight: 700,
            padding: "3px 10px",
            borderRadius: 999,
            flexShrink: 0,
            whiteSpace: "nowrap",
          }}
        >
          {displayValue}
        </span>
      </div>
      <div style={{ background: "var(--line)", borderRadius: 8, height: 10, overflow: "hidden" }}>
        <div
          style={{
            width: pct + "%",
            background: color || "var(--accent)",
            height: "100%",
            borderRadius: 8,
            transition: "width 0.3s",
          }}
        />
      </div>
    </div>
  );
}

// ---- กราฟแท่งแนวตั้ง 12 เดือน อ่านง่ายกว่าแบบแถบนอน ----
function MonthlyBarChart({ data, color }) {
  const width = 720;
  const height = 200;
  const padding = { top: 26, bottom: 26, left: 6, right: 6 };
  const chartW = width - padding.left - padding.right;
  const chartH = height - padding.top - padding.bottom;
  const barSlot = chartW / data.length;
  const barWidth = barSlot * 0.55;

  return (
    <svg viewBox={"0 0 " + width + " " + height} style={{ width: "100%", height: "auto", display: "block" }}>
      <line
        x1={padding.left}
        y1={height - padding.bottom}
        x2={width - padding.right}
        y2={height - padding.bottom}
        stroke="var(--line)"
        strokeWidth="1"
      />
      {data.map((d, i) => {
        const x = padding.left + i * barSlot + (barSlot - barWidth) / 2;
        const barH = Math.max(3, (d.value / 100) * chartH);
        const y = height - padding.bottom - barH;
        return (
          <g key={i}>
            <rect x={x} y={y} width={barWidth} height={barH} rx={4} fill={d.hasData ? color : "var(--line)"} />
            {d.hasData && (
              <text x={x + barWidth / 2} y={y - 7} textAnchor="middle" fontSize="11" fill="var(--ink-soft)">
                {Math.round(d.value)}%
              </text>
            )}
            <text x={x + barWidth / 2} y={height - padding.bottom + 17} textAnchor="middle" fontSize="11" fill="var(--ink-soft)">
              {d.label}
            </text>
          </g>
        );
      })}
    </svg>
  );
}

// ---- กราฟแท่งแนวตั้งสำหรับรายการยาว (เช่น 21 หลักสูตร) เลื่อนซ้าย-ขวาได้ ----
function RankedBarChart({ data, color, dangerColor, warnColor }) {
  const slotWidth = 66;
  const width = Math.max(720, data.length * slotWidth);
  const height = 230;
  const padding = { top: 30, bottom: 70, left: 10, right: 10 };
  const chartH = height - padding.top - padding.bottom;
  const barWidth = slotWidth * 0.5;

  const colorFor = (v) => (v >= 80 ? color : v >= 50 ? warnColor : dangerColor);

  return (
    <div style={{ overflowX: "auto", paddingBottom: 4 }}>
      <svg viewBox={"0 0 " + width + " " + height} style={{ width: width, height: "auto", display: "block" }}>
        <line
          x1={padding.left}
          y1={height - padding.bottom}
          x2={width - padding.right}
          y2={height - padding.bottom}
          stroke="var(--line)"
          strokeWidth="1"
        />
        {data.map((d, i) => {
          const x = padding.left + i * slotWidth + (slotWidth - barWidth) / 2;
          const barH = Math.max(3, (d.value / 100) * chartH);
          const y = height - padding.bottom - barH;
          const barColor = colorFor(d.value);
          return (
            <g key={i}>
              <rect
                x={x - 6}
                y={y - 24}
                width={barWidth + 12}
                height={18}
                rx={9}
                fill={barColor}
              />
              <text x={x + barWidth / 2} y={y - 11} textAnchor="middle" fontSize="10.5" fontWeight="700" fill="white">
                {Math.round(d.value)}%
              </text>
              <rect x={x} y={y} width={barWidth} height={barH} rx={4} fill={barColor} />
              <text
                x={x + barWidth / 2}
                y={height - padding.bottom + 14}
                textAnchor="end"
                fontSize="10.5"
                fill="var(--ink-soft)"
                transform={"rotate(-40 " + (x + barWidth / 2) + " " + (height - padding.bottom + 14) + ")"}
              >
                {d.shortLabel}
              </text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

// ---- หน้า Dashboard ภาพรวม (แอดมิน) ----
function DashboardPage() {
  const [year, setYear] = useState(2026);
  const [completionRows, setCompletionRows] = useState([]);
  const [attendanceRows, setAttendanceRows] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    loadAll();
  }, [year]);

  const loadAll = async () => {
    setLoading(true);
    const [compRes, attRes] = await Promise.all([
      supabaseClient
        .from("v_course_completion")
        .select("course_id, course_name, month, employee_id, total_exams, passed_exams, completed")
        .eq("year", year),
      supabaseClient
        .from("session_attendance")
        .select("status, training_sessions(training_calendar(year, month))"),
    ]);
    setCompletionRows(compRes.data || []);

    const attThisYear = (attRes.data || []).filter(
      (r) => r.training_sessions && r.training_sessions.training_calendar && r.training_sessions.training_calendar.year === year
    );
    setAttendanceRows(attThisYear);
    setLoading(false);
  };

  if (loading) return <div className="page">กำลังโหลด...</div>;

  // เอาเฉพาะแถวที่มีข้อสอบจริง (total_exams > 0) กันไม่ให้คอร์สที่ยังไม่มีข้อสอบ
  // ถูกนับเป็น "ไม่ผ่าน" ปนไปกับคนที่สอบจริงแล้วไม่ผ่าน
  const gradableRows = completionRows.filter((r) => r.total_exams > 0);

  // ---- สรุปภาพรวม ----
  const totalAttempts = gradableRows.length;
  const totalCompleted = gradableRows.filter((r) => r.completed).length;
  const overallRate = totalAttempts > 0 ? (totalCompleted / totalAttempts) * 100 : 0;
  const uniqueCourses = new Set(completionRows.map((r) => r.course_id)).size;
  const uniqueEmployees = new Set(completionRows.map((r) => r.employee_id)).size;

  // ---- อัตราผ่านรายเดือน ----
  const monthlyStats = {};
  for (let m = 1; m <= 12; m++) monthlyStats[m] = { total: 0, completed: 0 };
  gradableRows.forEach((r) => {
    monthlyStats[r.month].total += 1;
    if (r.completed) monthlyStats[r.month].completed += 1;
  });

  // ---- อัตราผ่านรายคอร์ส ----
  const courseStats = {};
  gradableRows.forEach((r) => {
    if (!courseStats[r.course_name]) courseStats[r.course_name] = { total: 0, completed: 0 };
    courseStats[r.course_name].total += 1;
    if (r.completed) courseStats[r.course_name].completed += 1;
  });
  const courseStatsList = Object.entries(courseStats)
    .map(([name, s]) => ({
      name,
      rate: s.total > 0 ? (s.completed / s.total) * 100 : 0,
      total: s.total,
      shortLabel: name.split(" ")[0].length <= 16 ? name.split(" ")[0] : name.slice(0, 14) + "…",
    }))
    .sort((a, b) => b.rate - a.rate);

  // ---- อัตราการเข้าอบรมรายเดือน ----
  const attendanceMonthly = {};
  for (let m = 1; m <= 12; m++) attendanceMonthly[m] = { total: 0, present: 0 };
  attendanceRows.forEach((r) => {
    const m = r.training_sessions.training_calendar.month;
    attendanceMonthly[m].total += 1;
    if (r.status === "present") attendanceMonthly[m].present += 1;
  });
  const totalAttendanceRecords = attendanceRows.length;
  const totalPresent = attendanceRows.filter((r) => r.status === "present").length;
  const overallAttendanceRate = totalAttendanceRecords > 0 ? (totalPresent / totalAttendanceRecords) * 100 : 0;

  return (
    <div className="page">
      <div className="header-row">
        <h2>Dashboard ภาพรวมปี {year}</h2>
        <div style={{ display: "flex", gap: 8 }}>
          <button className="secondary" onClick={() => setYear(year - 1)}>◀ {year - 1}</button>
          <button className="secondary" onClick={() => setYear(year + 1)}>{year + 1} ▶</button>
          <button className="refresh-btn" onClick={loadAll}>🔄 รีเฟรช</button>
        </div>
      </div>

      {/* สรุปภาพรวม */}
      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", margin: "16px 0" }}>
        {[
          { label: "หลักสูตรที่มีข้อสอบ", value: uniqueCourses, suffix: "" },
          { label: "พนักงานที่ถูกติดตาม", value: uniqueEmployees, suffix: " คน" },
          { label: "อัตราผ่านรวมทั้งปี", value: overallRate.toFixed(1), suffix: "%" },
          { label: "อัตราเข้าอบรมรวม", value: overallAttendanceRate.toFixed(1), suffix: "%" },
        ].map((s, i) => (
          <div key={i} className="course-card" style={{ cursor: "default", flex: "1 1 160px", textAlign: "center" }}>
            <div style={{ fontSize: 24, fontWeight: 700, color: "var(--accent)" }}>{s.value}{s.suffix}</div>
            <div style={{ fontSize: 13, color: "var(--ink-soft)", marginTop: 4 }}>{s.label}</div>
          </div>
        ))}
      </div>

      {/* อัตราผ่านรายเดือน */}
      <h3 style={{ marginTop: 24 }}>อัตราสอบผ่านรายเดือน (ทั้งบริษัท)</h3>
      {totalAttempts === 0 ? (
        <p style={{ color: "var(--ink-soft)" }}>ยังไม่มีข้อมูลข้อสอบในปีนี้</p>
      ) : (
        <MonthlyBarChart
          color="var(--success)"
          data={MONTH_NAMES.slice(1).map((name, i) => {
            const m = i + 1;
            const s = monthlyStats[m];
            const rate = s.total > 0 ? (s.completed / s.total) * 100 : 0;
            return { label: name, value: rate, hasData: s.total > 0 };
          })}
        />
      )}

      {/* อัตราผ่านรายคอร์ส */}
      <h3 style={{ marginTop: 28 }}>อัตราสอบผ่านรายหลักสูตร</h3>
      {courseStatsList.length === 0 ? (
        <p style={{ color: "var(--ink-soft)" }}>ยังไม่มีข้อมูล</p>
      ) : (
        <>
          <RankedBarChart
            data={courseStatsList}
            color="var(--success)"
            warnColor="var(--warn)"
            dangerColor="var(--danger)"
          />
          <p style={{ fontSize: 12, color: "var(--ink-soft)", marginTop: 2 }}>
            เลื่อนซ้าย-ขวาเพื่อดูหลักสูตรอื่น · เรียงจากอัตราผ่านสูงไปต่ำ
          </p>
          <div style={{ marginTop: 12 }}>
            {courseStatsList.map((c) => (
              <BarRow
                key={c.name}
                label={c.name}
                value={c.rate}
                maxValue={100}
                displayValue={c.rate.toFixed(0) + "% (n=" + c.total + ")"}
                color={c.rate >= 80 ? "var(--success)" : c.rate >= 50 ? "var(--warn)" : "var(--danger)"}
              />
            ))}
          </div>
        </>
      )}

      {/* อัตราการเข้าอบรมรายเดือน */}
      <h3 style={{ marginTop: 28 }}>อัตราการเข้าอบรมรายเดือน</h3>
      {totalAttendanceRecords === 0 ? (
        <p style={{ color: "var(--ink-soft)" }}>ยังไม่มีข้อมูลการมาร์คเข้าอบรมในปีนี้</p>
      ) : (
        <MonthlyBarChart
          color="var(--accent)"
          data={MONTH_NAMES.slice(1).map((name, i) => {
            const m = i + 1;
            const s = attendanceMonthly[m];
            const rate = s.total > 0 ? (s.present / s.total) * 100 : 0;
            return { label: name, value: rate, hasData: s.total > 0 };
          })}
        />
      )}
    </div>
  );
}


// ---- แถวมาร์คการเข้าอบรมของพนักงาน 1 คน ----
function AttendanceRow({ emp, data, onToggle, onNote, onRemove }) {
  // กันไว้เผื่อ data ยังไม่มา (ไม่ควรเกิดขึ้นแล้วหลังแก้ openSession แต่กันพลาดไว้)
  const safeData = data || { status: "present", note: "" };
  const present = safeData.status === "present";
  return (
    <div className="attendance-row">
      <div style={{ flex: 1 }}>
        <div className="name">{emp.name}</div>
        <div className="meta">
          {emp.employee_code}{emp.shift ? " · กะ" + emp.shift : ""}
        </div>
      </div>
      <button
        className={"status-btn " + (present ? "present" : "absent")}
        onClick={onToggle}
      >
        {present ? "มา" : "ขาด"}
      </button>
      <input
        type="text"
        className="note-input"
        placeholder="หมายเหตุ"
        value={safeData.note || ""}
        onChange={(e) => onNote(e.target.value)}
      />
      {onRemove && (
        <button className="secondary" onClick={onRemove}>×</button>
      )}
    </div>
  );
}

// ---- หน้า Foreman: มาร์คการเข้าอบรม ----
function ForemanPage({ session }) {
  const [me, setMe] = useState(null);
  const [employees, setEmployees] = useState([]);
  const [calendarRows, setCalendarRows] = useState([]);
  const [selectedMonth, setSelectedMonth] = useState(null);
  const [selectedEntry, setSelectedEntry] = useState(null);
  const [sessions, setSessions] = useState([]);
  const [selectedSession, setSelectedSession] = useState(null);
  const [attendance, setAttendance] = useState({});
  const [loading, setLoading] = useState(true);
  const [savingMsg, setSavingMsg] = useState("");
  const [newDate, setNewDate] = useState(() => new Date().toISOString().slice(0, 10));
  const [newShift, setNewShift] = useState("");

  useEffect(() => {
    loadInitial();
  }, []);

  const loadInitial = async () => {
    setLoading(true);
    const code = session.user.email.split("@")[0];
    const [meRes, empRes, calRes] = await Promise.all([
      supabaseClient
        .from("employees")
        .select("id, employee_code, name, shift")
        .eq("employee_code", code)
        .single(),
      supabaseClient
        .from("employees")
        .select("id, employee_code, name, shift")
        .eq("active", true)
        .order("name"),
      supabaseClient
        .from("training_calendar")
        .select("id, year, month, course_id, courses(name)")
        .order("year")
        .order("month"),
    ]);
    setMe(meRes.data || null);
    setEmployees(empRes.data || []);
    setCalendarRows(calRes.data || []);
    if (calRes.data && calRes.data.length > 0) setSelectedMonth(calRes.data[0].month);
    setLoading(false);
  };

  const shiftOptions = [...new Set(employees.map((e) => e.shift).filter(Boolean))];

  const openEntry = async (entry) => {
    setSelectedEntry(entry);
    setSelectedSession(null);
    setNewShift((me && me.shift) || shiftOptions[0] || "");
    const { data } = await supabaseClient
      .from("training_sessions")
      .select("id, session_date, shift, foreman_id")
      .eq("calendar_id", entry.id)
      .order("session_date", { ascending: false });
    setSessions(data || []);
  };

  const createSession = async () => {
    if (!newDate || !newShift) {
      alert("กรุณาเลือกวันที่และกะ");
      return;
    }
    const { data, error } = await supabaseClient
      .from("training_sessions")
      .insert({
        calendar_id: selectedEntry.id,
        foreman_id: me ? me.id : null,
        session_date: newDate,
        shift: newShift,
      })
      .select()
      .single();
    if (error) {
      alert("สร้าง session ไม่สำเร็จ: " + error.message);
      return;
    }
    setSessions([data, ...sessions]);
    openSession(data);
  };

  const openSession = async (sess) => {
    // สร้างรายชื่อ default (พนักงานกะเดียวกัน = "มา") และ set ทันที
    // ก่อนไปดึงข้อมูลเก่า เพื่อไม่ให้มีช่วงที่หน้าจอ render โดยไม่มีข้อมูล attendance เลย
    const defaultMap = {};
    employees
      .filter((e) => e.shift === sess.shift)
      .forEach((e) => {
        defaultMap[e.id] = { status: "present", note: "" };
      });
    setSelectedSession(sess);
    setAttendance(defaultMap);

    const { data, error } = await supabaseClient
      .from("session_attendance")
      .select("employee_id, status, note")
      .eq("session_id", sess.id);
    if (error) {
      console.error("โหลดข้อมูลการเข้าอบรมเดิมไม่สำเร็จ:", error.message);
      return;
    }
    if (data && data.length > 0) {
      setAttendance((prev) => {
        const merged = { ...prev };
        data.forEach((r) => {
          merged[r.employee_id] = { status: r.status || "present", note: r.note || "" };
        });
        return merged;
      });
    }
  };

  const toggleStatus = (empId) => {
    setAttendance((prev) => ({
      ...prev,
      [empId]: {
        ...prev[empId],
        status: prev[empId].status === "present" ? "absent" : "present",
      },
    }));
  };

  const setNote = (empId, note) => {
    setAttendance((prev) => ({ ...prev, [empId]: { ...prev[empId], note } }));
  };

  const addEmployee = (empId) => {
    if (!empId || attendance[empId]) return;
    setAttendance((prev) => ({ ...prev, [empId]: { status: "present", note: "" } }));
  };

  const removeEmployee = (empId) => {
    setAttendance((prev) => {
      const copy = { ...prev };
      delete copy[empId];
      return copy;
    });
  };

  const saveAttendance = async () => {
    const rows = Object.entries(attendance).map(([employee_id, v]) => ({
      session_id: selectedSession.id,
      employee_id,
      status: v.status,
      note: v.note || null,
      confirmed_at: new Date().toISOString(),
    }));
    if (rows.length === 0) {
      alert("ยังไม่มีรายชื่อให้บันทึก");
      return;
    }
    setSavingMsg("กำลังบันทึก...");
    const { error } = await supabaseClient
      .from("session_attendance")
      .upsert(rows, { onConflict: "session_id,employee_id" });
    if (error) {
      setSavingMsg("");
      alert("บันทึกไม่สำเร็จ: " + error.message);
      return;
    }
    setSavingMsg("บันทึกแล้ว ✓");
    setTimeout(() => setSavingMsg(""), 2500);
  };

  if (loading) return <div className="page">กำลังโหลด...</div>;

  // ----- หน้าจอ 3: มาร์คการเข้าอบรม -----
  if (selectedSession) {
    const defaultIds = new Set(
      employees.filter((e) => e.shift === selectedSession.shift).map((e) => e.id)
    );
    const markedIds = Object.keys(attendance);
    const extraIds = markedIds.filter((id) => !defaultIds.has(id));
    const notAddedYet = employees.filter((e) => !attendance[e.id]);

    return (
      <div className="page">
        <div className="header-row">
          <button className="secondary" onClick={() => setSelectedSession(null)}>
            ← กลับไปเลือก session
          </button>
          <button className="refresh-btn" onClick={() => openSession(selectedSession)}>
            🔄 รีเฟรช
          </button>
        </div>
        <h2 style={{ marginTop: 16 }}>
          {selectedEntry.courses ? selectedEntry.courses.name : "หลักสูตร"}
        </h2>
        <p style={{ color: "#667085" }}>
          วันที่ {selectedSession.session_date} · กะ {selectedSession.shift || "-"}
        </p>

        <h3>รายชื่อ (กะ {selectedSession.shift || "-"})</h3>
        {defaultIds.size === 0 && (
          <p style={{ color: "#667085" }}>ไม่พบพนักงานกะนี้</p>
        )}
        {employees
          .filter((e) => defaultIds.has(e.id))
          .map((e) => (
            <AttendanceRow
              key={e.id}
              emp={e}
              data={attendance[e.id]}
              onToggle={() => toggleStatus(e.id)}
              onNote={(n) => setNote(e.id, n)}
            />
          ))}

        {extraIds.length > 0 && (
          <React.Fragment>
            <h3 style={{ marginTop: 20 }}>เพิ่มเติมนอกกะ</h3>
            {employees
              .filter((e) => extraIds.includes(e.id))
              .map((e) => (
                <AttendanceRow
                  key={e.id}
                  emp={e}
                  data={attendance[e.id]}
                  onToggle={() => toggleStatus(e.id)}
                  onNote={(n) => setNote(e.id, n)}
                  onRemove={() => removeEmployee(e.id)}
                />
              ))}
          </React.Fragment>
        )}

        <div style={{ marginTop: 20 }}>
          <select
            onChange={(e) => {
              addEmployee(e.target.value);
              e.target.value = "";
            }}
            defaultValue=""
          >
            <option value="" disabled>+ เพิ่มพนักงานคนอื่น...</option>
            {notAddedYet.map((e) => (
              <option key={e.id} value={e.id}>
                {e.name} ({e.employee_code}){e.shift ? " - กะ" + e.shift : ""}
              </option>
            ))}
          </select>
        </div>

        <div style={{ marginTop: 24, display: "flex", alignItems: "center", gap: 12 }}>
          <button onClick={saveAttendance}>บันทึกการเข้าอบรม</button>
          {savingMsg && <span style={{ color: "#067647" }}>{savingMsg}</span>}
        </div>
      </div>
    );
  }

  // ----- หน้าจอ 2: เลือก / สร้าง session -----
  if (selectedEntry) {
    return (
      <div className="page">
        <div className="header-row">
          <button className="secondary" onClick={() => setSelectedEntry(null)}>
            ← กลับไปเลือกหลักสูตร
          </button>
          <button className="refresh-btn" onClick={() => openEntry(selectedEntry)}>
            🔄 รีเฟรช
          </button>
        </div>
        <h2 style={{ marginTop: 16 }}>
          {selectedEntry.courses ? selectedEntry.courses.name : "หลักสูตร"}
        </h2>
        <p style={{ color: "#667085" }}>
          {MONTH_NAMES[selectedEntry.month]} {selectedEntry.year}
        </p>

        <h3>Session ที่มีอยู่</h3>
        {sessions.length === 0 && (
          <p style={{ color: "#667085" }}>ยังไม่มี session สำหรับหลักสูตรนี้</p>
        )}
        {sessions.map((s) => (
          <div className="course-card" key={s.id} onClick={() => openSession(s)}>
            <div className="icon-circle ok">
              <i className="ti ti-calendar-event" aria-hidden="true"></i>
            </div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontWeight: 600, marginBottom: 4 }}>{s.session_date}</div>
              <span className="badge ok">กะ {s.shift || "-"}</span>
            </div>
            <i className="ti ti-chevron-right" style={{ color: "var(--ink-soft)", fontSize: 18, flexShrink: 0 }} aria-hidden="true"></i>
          </div>
        ))}

        <h3 style={{ marginTop: 24 }}>สร้าง session ใหม่</h3>
        <div className="new-session-row">
          <input
            type="date"
            value={newDate}
            onChange={(e) => setNewDate(e.target.value)}
          />
          <select value={newShift} onChange={(e) => setNewShift(e.target.value)}>
            <option value="" disabled>เลือกกะ</option>
            {shiftOptions.map((s) => (
              <option key={s} value={s}>{s}</option>
            ))}
          </select>
          <button onClick={createSession}>สร้าง + เริ่มมาร์ค</button>
        </div>
      </div>
    );
  }

  // ----- หน้าจอ 1: เลือกหลักสูตร/เดือน -----
  const months = [...new Set(calendarRows.map((r) => r.month))].sort((a, b) => a - b);
  const rowsThisMonth = calendarRows.filter((r) => r.month === selectedMonth);

  return (
    <div className="page">
      <div className="header-row">
        <h2>เลือกหลักสูตรที่จะมาร์คการเข้าอบรม</h2>
        <button className="refresh-btn" onClick={loadInitial}>🔄 รีเฟรช</button>
      </div>
      <div className="month-tabs">
        {months.map((m) => (
          <div
            key={m}
            className={"month-tab" + (m === selectedMonth ? " active" : "")}
            onClick={() => setSelectedMonth(m)}
          >
            {MONTH_NAMES[m]}
          </div>
        ))}
      </div>
      {rowsThisMonth.length === 0 ? (
        <p style={{ color: "#667085" }}>ไม่มีหลักสูตรจัดสอนเดือนนี้</p>
      ) : (
        rowsThisMonth.map((entry) => (
          <div className="course-card" key={entry.id} onClick={() => openEntry(entry)}>
            <div className="icon-circle ok">
              <i className="ti ti-book-2" aria-hidden="true"></i>
            </div>
            <div style={{ flex: 1, fontWeight: 600 }}>
              {entry.courses ? entry.courses.name : "(ไม่พบชื่อหลักสูตร)"}
            </div>
            <i className="ti ti-chevron-right" style={{ color: "var(--ink-soft)", fontSize: 18, flexShrink: 0 }} aria-hidden="true"></i>
          </div>
        ))
      )}
    </div>
  );
}

// ---- แถวแสดงสถานะข้อสอบ 1 วิชา (หน้าพนักงาน) ----
function ExamStatusRow({ exam, attempt, onTakeExam }) {
  const everPassed = attempt ? !!attempt.everPassed : false;
  const latest = attempt ? attempt.latest : null;

  let statusBadge;
  if (everPassed) {
    statusBadge = <span className="badge ok">ผ่านแล้ว</span>;
  } else if (latest) {
    statusBadge = <span className="badge warn">ยังไม่ผ่าน</span>;
  } else {
    statusBadge = <span className="badge warn">ยังไม่สอบ</span>;
  }

  return (
    <div className="attendance-row">
      <div style={{ flex: 1 }}>
        <div className="name">{exam.exam_name}</div>
        <div className="meta">
          {latest ? "คะแนนล่าสุด " + latest.raw_score + " / " + latest.max_score : "ยังไม่มีการสอบ"}
          {latest && latest.attempt_no ? " · ครั้งที่ " + latest.attempt_no : ""}
        </div>
      </div>
      {statusBadge}
      <button onClick={() => onTakeExam(exam)}>เข้าสอบ</button>
    </div>
  );
}

// ---- หน้าพนักงาน: ดูหลักสูตร + เข้าสอบ ----
function EmployeePage({ session }) {
  const [me, setMe] = useState(null);
  const [calendarRows, setCalendarRows] = useState([]);
  const [examsByCourse, setExamsByCourse] = useState({});
  const [completionMap, setCompletionMap] = useState({});
  const [selectedMonth, setSelectedMonth] = useState(null);
  const [selectedEntry, setSelectedEntry] = useState(null);
  const [courseExams, setCourseExams] = useState([]);
  const [attemptsByExam, setAttemptsByExam] = useState({});
  const [loading, setLoading] = useState(true);
  const [loadingDetail, setLoadingDetail] = useState(false);

  useEffect(() => {
    loadInitial();
  }, []);

  const loadInitial = async () => {
    setLoading(true);
    const code = session.user.email.split("@")[0];
    const [meRes, calRes, examRes] = await Promise.all([
      supabaseClient
        .from("employees")
        .select("id, employee_code, name, shift")
        .eq("employee_code", code)
        .single(),
      supabaseClient
        .from("training_calendar")
        .select("id, year, month, course_id, courses(name)")
        .order("year")
        .order("month"),
      supabaseClient.from("exams").select("id, course_id"),
    ]);

    setMe(meRes.data || null);
    setCalendarRows(calRes.data || []);

    const examCount = {};
    (examRes.data || []).forEach((r) => {
      examCount[r.course_id] = (examCount[r.course_id] || 0) + 1;
    });
    setExamsByCourse(examCount);

    // โหลดสถานะผ่าน/ไม่ผ่านของตัวเองต่อ calendar entry (จาก view สำเร็จรูป)
    if (code) {
      const { data: compData } = await supabaseClient
        .from("v_course_completion")
        .select("calendar_id, total_exams, passed_exams, completed")
        .eq("employee_code", code);
      const map = {};
      (compData || []).forEach((r) => {
        map[r.calendar_id] = r;
      });
      setCompletionMap(map);
    }

    // default = เดือนปัจจุบันจริงๆ ถ้ามีข้อมูลเดือนนั้น ไม่งั้น fallback เดือนแรกที่มี
    const now = new Date();
    const thisMonth = now.getMonth() + 1;
    const months = [...new Set((calRes.data || []).map((r) => r.month))];
    if (months.includes(thisMonth)) {
      setSelectedMonth(thisMonth);
    } else if (calRes.data && calRes.data.length > 0) {
      setSelectedMonth(calRes.data[0].month);
    }
    setLoading(false);
  };

  const openEntry = async (entry) => {
    setSelectedEntry(entry);
    setLoadingDetail(true);
    const { data: exams } = await supabaseClient
      .from("exams")
      .select("id, exam_name, exam_form_url, plan_id_entry")
      .eq("course_id", entry.course_id)
      .order("exam_name");
    setCourseExams(exams || []);

    if (me && exams && exams.length > 0) {
      const examIds = exams.map((e) => e.id);
      const { data: attempts } = await supabaseClient
        .from("exam_attempts")
        .select("exam_id, raw_score, max_score, passed, attempt_no")
        .eq("employee_id", me.id)
        .in("exam_id", examIds);

      const grouped = {};
      (attempts || []).forEach((a) => {
        if (!grouped[a.exam_id]) grouped[a.exam_id] = [];
        grouped[a.exam_id].push(a);
      });
      const summary = {};
      Object.keys(grouped).forEach((examId) => {
        const list = grouped[examId].sort((x, y) => (y.attempt_no || 0) - (x.attempt_no || 0));
        summary[examId] = {
          latest: list[0],
          everPassed: list.some((a) => a.passed),
        };
      });
      setAttemptsByExam(summary);
    } else {
      setAttemptsByExam({});
    }
    setLoadingDetail(false);
  };

  const handleTakeExam = (exam) => {
    if (!exam.exam_form_url) {
      alert("ยังไม่มีลิงก์ข้อสอบสำหรับวิชานี้");
      return;
    }
    // หมายเหตุ: exam_form_url ที่ import มาแล้ว prefill รหัสข้อสอบ (exam_id) ไว้ในตัวเองสมบูรณ์แล้ว
    // ระบบเช็คว่าอยู่เดือนไหนจาก exam_attempts.submitted_at เทียบกับ training_calendar
    // ไม่ได้ใช้ calendar_id/Plan_ID มาจับคู่ จึงไม่ต้องต่อพารามิเตอร์อะไรเพิ่มที่นี่
    window.open(exam.exam_form_url, "_blank");
  };

  if (loading) return <div className="page">กำลังโหลด...</div>;

  // ----- หน้าจอ 2: รายวิชา + เข้าสอบ -----
  if (selectedEntry) {
    return (
      <div className="page">
        <div className="header-row">
          <button className="secondary" onClick={() => setSelectedEntry(null)}>
            ← กลับไปเลือกหลักสูตร
          </button>
          <button className="refresh-btn" onClick={() => openEntry(selectedEntry)}>
            🔄 รีเฟรช
          </button>
        </div>
        <h2 style={{ marginTop: 16 }}>
          {selectedEntry.courses ? selectedEntry.courses.name : "หลักสูตร"}
        </h2>
        <p style={{ color: "#667085" }}>
          {MONTH_NAMES[selectedEntry.month]} {selectedEntry.year}
        </p>

        {loadingDetail ? (
          <p style={{ color: "#667085" }}>กำลังโหลดรายวิชา...</p>
        ) : courseExams.length === 0 ? (
          <p style={{ color: "#667085" }}>ยังไม่มีข้อสอบสำหรับหลักสูตรนี้</p>
        ) : (
          courseExams.map((exam) => (
            <ExamStatusRow
              key={exam.id}
              exam={exam}
              attempt={attemptsByExam[exam.id]}
              onTakeExam={handleTakeExam}
            />
          ))
        )}
      </div>
    );
  }

  // ----- หน้าจอ 1: เลือกหลักสูตร/เดือน -----
  const months = [...new Set(calendarRows.map((r) => r.month))].sort((a, b) => a - b);
  const rowsThisMonth = calendarRows.filter((r) => r.month === selectedMonth);

  return (
    <div className="page">
      <div className="header-row">
        <h2>หลักสูตรของฉัน</h2>
        <button className="refresh-btn" onClick={loadInitial}>🔄 รีเฟรช</button>
      </div>
      <div className="month-tabs">
        {months.map((m) => (
          <div
            key={m}
            className={"month-tab" + (m === selectedMonth ? " active" : "")}
            onClick={() => setSelectedMonth(m)}
          >
            {MONTH_NAMES[m]}
          </div>
        ))}
      </div>

      {rowsThisMonth.length === 0 ? (
        <p style={{ color: "#667085" }}>ไม่มีหลักสูตรจัดสอนเดือนนี้</p>
      ) : (
        rowsThisMonth.map((entry) => {
          const comp = completionMap[entry.id];
          const total = comp ? comp.total_exams : examsByCourse[entry.course_id] || 0;
          const passedCount = comp ? comp.passed_exams : 0;
          const completed = comp ? comp.completed : false;
          return (
            <div className="course-card" key={entry.id} onClick={() => openEntry(entry)}>
              <div className={"icon-circle " + (completed ? "ok" : "warn")}>
                <i className={"ti " + (completed ? "ti-check" : "ti-book-2")} aria-hidden="true"></i>
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontWeight: 600, marginBottom: 6 }}>
                  {entry.courses ? entry.courses.name : "(ไม่พบชื่อหลักสูตร)"}
                </div>
                <span className={"badge " + (completed ? "ok" : "warn")}>
                  {passedCount} / {total} ผ่านแล้ว
                </span>
              </div>
              <i className="ti ti-chevron-right" style={{ color: "var(--ink-soft)", fontSize: 18, flexShrink: 0 }} aria-hidden="true"></i>
            </div>
          );
        })
      )}
    </div>
  );
}

// ---- หน้ารวม แยกตาม role ----
// ---- หน้าหลัก: ต้อนรับ + ทางลัดไปหน้าอื่น ----
function HomePage({ role, navItems, onNavigate }) {
  const now = new Date();
  const hour = now.getHours();
  const greeting = hour < 12 ? "สวัสดีตอนเช้า" : hour < 18 ? "สวัสดีตอนบ่าย" : "สวัสดีตอนเย็น";
  const shortcuts = navItems.filter((item) => item.key !== "home");
  const quotes = [
    "การเรียนรู้วันนี้ คือความปลอดภัยของวันพรุ่งนี้",
    "ทุกข้อสอบที่ผ่าน คือมาตรฐานที่สูงขึ้นของทีมเรา",
    "ความใส่ใจเล็กๆ วันนี้ ป้องกันปัญหาใหญ่ในวันหน้า",
  ];
  const quote = quotes[now.getDate() % quotes.length];

  return (
    <div className="page">
      <div className="nav-section" style={{ padding: 20 }}>
        <h2 style={{ margin: 0 }}>{greeting} 👋</h2>
        <p style={{ color: "var(--ink-soft)", marginTop: 6, marginBottom: 0 }}>
          ยินดีต้อนรับสู่ระบบข้อสอบ QPT เลือกเมนูที่ต้องการทำต่อได้จากด้านล่าง
        </p>
      </div>
      <div className="tile-row" style={{ marginTop: 4 }}>
        {shortcuts.map((item) => (
          <div
            key={item.key}
            className={"tile tile-" + item.color}
            onClick={() => onNavigate(item.key)}
          >
            <div className="tile-top">
              <div className="tile-icon-circle">
                <i className={"ti " + item.icon} aria-hidden="true"></i>
              </div>
              <i className="ti ti-arrow-up-right" aria-hidden="true"></i>
            </div>
            <div>
              <div className="tile-label">{item.label}</div>
              {item.desc && <div className="tile-desc">{item.desc}</div>}
            </div>
          </div>
        ))}
      </div>
      <div
        className="nav-section"
        style={{ padding: 20, marginTop: 14, background: "var(--accent-bg)", border: "none" }}
      >
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <i className="ti ti-quote" style={{ fontSize: 26, color: "var(--accent-dark)", flexShrink: 0 }} aria-hidden="true"></i>
          <p style={{ margin: 0, color: "var(--accent-dark)", fontWeight: 600, fontSize: 14.5 }}>
            {quote}
          </p>
        </div>
      </div>
    </div>
  );
}

// ---- หน้ารวม แยกตาม role: โครง Sidebar (จอกว้าง) / เมนูเลื่อน (จอแคบ) ----
function Dashboard({ session, role, onLogout }) {
  const roleLabel = { admin: "แอดมิน (เจ้าหน้าที่)", foreman: "Foreman", employee: "พนักงาน" }[role] || role;
  const [view, setView] = useState("home");
  const [drawerOpen, setDrawerOpen] = useState(false);

  const navItemsByRole = {
    admin: [
      { key: "home", label: "หน้าหลัก", icon: "ti-home", color: "green" },
      { key: "scores", label: "ดูคะแนน", icon: "ti-chart-bar", color: "orange", desc: "ผลสอบของพนักงานรายเดือน" },
      { key: "planner", label: "วางแผนรายปี", icon: "ti-calendar-event", color: "purple", desc: "จัดตารางอบรมทั้งปี" },
      { key: "dashboard", label: "Dashboard", icon: "ti-layout-dashboard", color: "teal", desc: "ภาพรวมอัตราผ่าน/เข้าอบรม" },
      { key: "exam", label: "สอบของฉัน", icon: "ti-pencil", color: "blue", desc: "ทำแบบทดสอบของตัวเอง" },
    ],
    foreman: [
      { key: "home", label: "หน้าหลัก", icon: "ti-home", color: "green" },
      { key: "main", label: "งานของฉัน", icon: "ti-briefcase", color: "green", desc: "มาร์คการเข้าอบรม" },
      { key: "exam", label: "สอบของฉัน", icon: "ti-pencil", color: "blue", desc: "ทำแบบทดสอบของตัวเอง" },
    ],
    employee: [
      { key: "home", label: "หน้าหลัก", icon: "ti-home", color: "green" },
      { key: "exam", label: "สอบของฉัน", icon: "ti-pencil", color: "blue", desc: "ดูคอร์สและทำแบบทดสอบ" },
    ],
  };
  const navItems = navItemsByRole[role] || navItemsByRole.employee;

  const goTo = (key) => {
    setView(key);
    setDrawerOpen(false);
  };

  const renderContent = () => {
    if (view === "home") return <HomePage role={role} navItems={navItems} onNavigate={goTo} />;
    if (role === "admin") {
      if (view === "scores") return <AdminCalendarPage />;
      if (view === "planner") return <AnnualPlannerPage />;
      if (view === "dashboard") return <DashboardPage />;
      if (view === "exam") return <EmployeePage session={session} />;
    }
    if (role === "foreman") {
      if (view === "main") return <ForemanPage session={session} />;
      if (view === "exam") return <EmployeePage session={session} />;
    }
    return <EmployeePage session={session} />;
  };

  const sidebarInner = (
    <React.Fragment>
      <div className="sidebar-logo">
        <div className="icon-circle ok">
          <i className="ti ti-clipboard-check" aria-hidden="true"></i>
        </div>
        QPT
      </div>
      {navItems.map((item) => (
        <div
          key={item.key}
          className={"sidebar-item" + (view === item.key ? " active" : "")}
          onClick={() => goTo(item.key)}
        >
          <i className={"ti " + item.icon} aria-hidden="true"></i>
          {item.label}
        </div>
      ))}
    </React.Fragment>
  );

  return (
    <div className="app-shell">
      <div className={"sidebar" + (drawerOpen ? " drawer-open" : "")}>{sidebarInner}</div>
      {drawerOpen && <div className="drawer-overlay open" onClick={() => setDrawerOpen(false)}></div>}

      <div className="main-content">
        <div className="content-topbar">
          <div className="content-topbar-left">
            <button className="hamburger-btn" onClick={() => setDrawerOpen(true)}>
              <i className="ti ti-menu-2" aria-hidden="true"></i>
            </button>
            <span className="role-badge" style={{ marginBottom: 0 }}>{roleLabel}</span>
          </div>
          <div className="content-topbar-right">
            <button className="logout-btn" onClick={onLogout}>
              <i className="ti ti-logout-2" aria-hidden="true"></i>
              ออกจากระบบ
            </button>
          </div>
        </div>

        {renderContent()}
      </div>
    </div>
  );
}

function App() {
  const [session, setSession] = useState(null);
  const [role, setRole] = useState(null);
  const [loadingSession, setLoadingSession] = useState(true);

  useEffect(() => {
    supabaseClient.auth.getSession().then(({ data }) => {
      if (data.session) {
        applySession(data.session);
      } else {
        setLoadingSession(false);
      }
    });
  }, []);

  const applySession = (session) => {
    setSession(session);
    setRole(session.user.user_metadata.role || "employee");
    setLoadingSession(false);
  };

  const handleLogout = async () => {
    await supabaseClient.auth.signOut();
    setSession(null);
    setRole(null);
  };

  // ออกจากระบบอัตโนมัติถ้าไม่มีการใช้งาน 3 นาที
  // (สำคัญมากสำหรับแท็บเล็ตที่ใช้ร่วมกันหลายคน กันคนถัดไปเห็น session ค้าง)
  useEffect(() => {
    if (!session) return;
    let timer;
    const resetTimer = () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        handleLogout();
      }, 3 * 60 * 1000);
    };
    const events = ["click", "keydown", "touchstart"];
    events.forEach((e) => window.addEventListener(e, resetTimer));
    resetTimer();
    return () => {
      clearTimeout(timer);
      events.forEach((e) => window.removeEventListener(e, resetTimer));
    };
  }, [session]);

  if (loadingSession) return <div className="container">กำลังโหลด...</div>;
  if (!session) return <LoginPage onLogin={applySession} />;
  return <Dashboard session={session} role={role} onLogout={handleLogout} />;
}

// ---- กันหน้าเปล่า: ถ้ามี error เกิดขึ้นระหว่าง render ให้ขึ้นข้อความแทนที่จะเป็นหน้าว่างๆ ----
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, message: "" };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, message: (error && error.message) || "เกิดข้อผิดพลาด" };
  }
  render() {
    if (this.state.hasError) {
      return (
        <div className="container">
          <h2>เกิดข้อผิดพลาด</h2>
          <p style={{ color: "#667085" }}>{this.state.message}</p>
          <button style={{ width: "100%" }} onClick={() => window.location.reload()}>
            โหลดหน้าใหม่
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <ErrorBoundary>
    <App />
  </ErrorBoundary>
);
</script>
</body>
